[project]
name = "tasty"
version = "0.1.0"
description = "Lineage-first governance control plane for AI agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0,<0.129.0",
  "uvicorn>=0.30.0,<0.40.0",
  "pydantic>=2.7.0,<2.14.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
